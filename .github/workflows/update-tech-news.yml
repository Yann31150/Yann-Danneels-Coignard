name: Update Tech News

on:
  schedule:
    # Exécute tous les jours à 8h UTC (9h heure française en hiver, 10h en été)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permet de déclencher manuellement

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests
        
    - name: Fetch tech news
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      run: |
        python scripts/fetch_tech_news.py
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Récupérer les derniers changements
        git fetch origin main
        
        # Ajouter le fichier généré
        git add docs/tech-news.json
        
        # Vérifier s'il y a des changements
        if git diff --staged --quiet; then
          echo "Aucun changement à commiter"
        else
          # Créer le commit
          git commit -m "Auto-update: Actualités tech du $(date +'%Y-%m-%d')"
          
          # Récupérer les changements distants et merger (en favorisant notre version pour tech-news.json)
          git pull origin main --no-rebase --strategy-option=ours -X theirs docs/tech-news.json || git pull origin main --no-rebase || true
          
          # Si conflit sur tech-news.json, utiliser notre version (la plus récente)
          if [ -f docs/tech-news.json ]; then
            git checkout --ours docs/tech-news.json || true
            git add docs/tech-news.json
            git commit -m "Résolution conflit: utiliser la version générée de tech-news.json" || true
          fi
          
          # Pousser les changements
          git push origin main
        fi
