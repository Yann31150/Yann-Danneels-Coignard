name: Update Tech News

on:
  schedule:
    # Exécute tous les jours à 8h UTC (9h heure française en hiver, 10h en été)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permet de déclencher manuellement

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests>=2.32.5
        
    - name: Fetch tech news
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: |
        python scripts/fetch_tech_news.py
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Récupérer les derniers changements (sans merger)
        git fetch origin main
        
        # Ajouter les fichiers générés
        git add docs/tech-news.json docs/rss.xml
        
        # Vérifier s'il y a des changements
        if git diff --staged --quiet; then
          echo "Aucun changement à commiter"
        else
          # Créer le commit
          git commit -m "Auto-update: Actualités tech du $(date +'%Y-%m-%d')"
          
          # Essayer de récupérer et merger les changements distants
          # En cas de conflit sur tech-news.json ou rss.xml, utiliser notre version (la plus récente générée)
          git pull origin main --no-edit || {
            echo "Conflit détecté, résolution..."
            # Si conflit, utiliser notre version des fichiers générés (la plus récente)
            git checkout --ours docs/tech-news.json docs/rss.xml 2>/dev/null || true
            git add docs/tech-news.json docs/rss.xml
            git commit -m "Résolution conflit: utiliser la version générée des fichiers" || true
          }
          
          # Pousser les changements
          git push origin main
        fi
